<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Панель поиска фильтров</title>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <form class="form" action="" role="search">
          <label class="form-label visually-hidden" for="search-input"
            >Поиск по сайту</label
          >
          <input
            class="form-input"
            type="search"
            name=""
            id="search-input"
            placeholder="Поиск файлов..."
          />
          <button class="form__btn form__btn--filter">Фильтры</button>
          <button class="form__btn form__btn--load">Загрузить</button>
        </form>
      </div>
    </div>
  </body>
</html>
